name: daily-sync

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 更新一次
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync stars from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-stars.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'chore: daily sync stars'
          git push
